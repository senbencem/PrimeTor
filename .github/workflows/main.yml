name: APK Yapici
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master
          # DİKKAT: Dosyalariniz 'oyun' diye bir klasordeyse asagiya oyun yazin.
          # Dosyalar ana dizindeyse bu satir gerekmez.
          workdir: dosya_klasorunun_adi 

      - name: APK'yi Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: PrimeTor-APK
          path: |
             bin/*.apk
             */bin/*.apk
